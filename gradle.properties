# Выделяем 8 ГБ под Gradle и включаем быстрый параллельный сборщик мусора
org.gradle.jvmargs=-Xmx8g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Отключаем Jetifier для ускорения фазы конфигурации
android.useAndroidX=true
android.enableJetifier=false

kotlin.code.style=official
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Максимальное распараллеливание процессов Gradle
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.vfs.watch=true

# Дополнительное ускорение инкрементальной сборки Kotlin
kotlin.incremental=true
org.gradle.configureondemand=true
